<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>小说在线阅读</title>
<style>
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --text: #1f2328;
    --muted: #6a737d;
    --border: #e1e4e8;
    --accent: #2f81f7;
    --accent-soft: #ddf4ff;
    --code-bg: #f6f8fa;
    --blockquote-border: #d0d7de;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117;
      --surface: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
      --accent: #58a6ff;
      --accent-soft: #1f2d3d;
      --code-bg: #1f242e;
      --blockquote-border: #3d444d;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }

  [data-theme="dark"] {
    --bg: #0d1117;
    --surface: #161b22;
    --text: #e6edf3;
    --muted: #8b949e;
    --border: #30363d;
    --accent: #58a6ff;
    --accent-soft: #1f2d3d;
    --code-bg: #1f242e;
    --blockquote-border: #3d444d;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }

  [data-theme="light"] {
    --bg: #faf9f7;
    --surface: #ffffff;
    --text: #1f2328;
    --muted: #6a737d;
    --border: #e1e4e8;
    --accent: #2f81f7;
    --accent-soft: #ddf4ff;
    --code-bg: #f6f8fa;
    --blockquote-border: #d0d7de;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.75;
    min-height: 100vh;
    transition: background-color .2s ease, color .2s ease;
  }

  a {
    color: var(--accent);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
  }

  .brand {
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .theme-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 8px;
    width: 36px;
    height: 36px;
    font-size: 18px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, border-color .15s;
  }

  .theme-btn:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .layout {
    display: flex;
    max-width: 1200px;
    margin: 0 auto;
    min-height: calc(100vh - 56px);
  }

  .sidebar {
    width: 260px;
    flex: 0 0 260px;
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 16px 0;
    max-height: calc(100vh - 56px);
    position: sticky;
    top: 56px;
    overflow-y: auto;
  }

  .sidebar-header {
    padding: 0 20px 12px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    font-weight: 600;
  }

  .chapter-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .chapter-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 20px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    border-left: 3px solid transparent;
    line-height: 1.4;
    transition: background .15s, border-color .15s;
  }

  .chapter-item:hover {
    background: var(--accent-soft);
  }

  .chapter-item.active {
    background: var(--accent-soft);
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  .chapter-num {
    color: var(--muted);
    font-size: 12px;
    display: block;
    margin-bottom: 2px;
  }

  .main {
    flex: 1;
    min-width: 0;
    padding: 32px 40px 60px;
  }

  .reader {
    max-width: 760px;
    margin: 0 auto;
  }

  .chapter-title {
    font-size: 28px;
    line-height: 1.3;
    margin: 0 0 8px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .chapter-file {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 28px;
  }

  .markdown-body h1,
  .markdown-body h2,
  .markdown-body h3,
  .markdown-body h4,
  .markdown-body h5,
  .markdown-body h6 {
    line-height: 1.35;
    margin: 1.6em 0 .6em;
  }

  .markdown-body h1 { font-size: 1.8em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  .markdown-body h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  .markdown-body h3 { font-size: 1.25em; }
  .markdown-body h4 { font-size: 1.1em; }
  .markdown-body p { margin: .9em 0; }
  .markdown-body ul, .markdown-body ol { padding-left: 1.6em; margin: .8em 0; }
  .markdown-body li { margin: .3em 0; }
  .markdown-body blockquote {
    margin: 1em 0;
    padding: .2em 1em;
    border-left: 4px solid var(--blockquote-border);
    color: var(--muted);
    background: var(--accent-soft);
    border-radius: 0 6px 6px 0;
  }
  .markdown-body pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    line-height: 1.5;
  }
  .markdown-body code {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: .1em .35em;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: .9em;
  }
  .markdown-body pre code {
    background: transparent;
    border: none;
    padding: 0;
    font-size: .88em;
  }
  .markdown-body hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2em 0;
  }
  .markdown-body img {
    max-width: 100%;
    border-radius: 6px;
  }

  .status {
    color: var(--muted);
    text-align: center;
    padding: 80px 20px;
  }

  .error-box {
    max-width: 600px;
    margin: 40px auto;
    padding: 20px 24px;
    border: 1px solid var(--border);
    border-left: 4px solid #d1242f;
    background: var(--surface);
    border-radius: 8px;
    color: var(--text);
    white-space: pre-line;
  }

  @media (max-width: 760px) {
    .layout {
      flex-direction: column;
    }
    .sidebar {
      width: 100%;
      flex: none;
      max-height: none;
      position: static;
      border-right: none;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      padding: 8px 0;
    }
    .chapter-list {
      display: flex;
      gap: 4px;
      padding: 0 12px;
    }
    .chapter-list li {
      flex: 0 0 auto;
    }
    .chapter-item {
      flex: 0 0 auto;
      width: auto;
      border-left: none;
      border-bottom: 3px solid transparent;
      padding: 8px 14px;
      border-radius: 8px;
    }
    .chapter-item.active {
      border-left: none;
      border-bottom-color: var(--accent);
    }
    .chapter-num {
      display: none;
    }
    .main {
      padding: 24px 18px 40px;
    }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">寻找生命的你和我</div>
  <button class="theme-btn" id="themeToggle" type="button" title="切换深浅色模式" aria-label="切换深浅色模式">🌙</button>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">目录</div>
    <nav id="chapterList" aria-label="章节列表"></nav>
  </aside>
  <main class="main">
    <article class="reader" id="reader">
      <div id="status" class="status">正在加载章节…</div>
    </article>
  </main>
</div>

<script>
(function () {
  'use strict';

  var MAX_CHAPTERS = 9999;
  var chapters = [];
  var currentIndex = -1;

  var reader = document.getElementById('reader');
  var statusEl = document.getElementById('status');
  var chapterListEl = document.getElementById('chapterList');
  var themeToggle = document.getElementById('themeToggle');

  // ---------- 主题 ----------
  function getInitialTheme() {
    var saved = null;
    try { saved = localStorage.getItem('novel-theme'); } catch (e) { /* ignore */ }
    if (saved === 'light' || saved === 'dark') return saved;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem('novel-theme', theme); } catch (e) { /* ignore */ }
  }

  var currentTheme = getInitialTheme();
  applyTheme(currentTheme);

  themeToggle.addEventListener('click', function () {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    applyTheme(currentTheme);
  });

  // ---------- 工具函数 ----------
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeUrl(url) {
    url = String(url || '').trim();
    if (/^(https?:|mailto:|tel:)/i.test(url) || /^[^:]+$/.test(url) || url.startsWith('/') || url.startsWith('./') || url.startsWith('../')) {
      return url;
    }
    return '#';
  }

  function inline(text) {
    var result = String(text);

    // 行内代码
    result = result.replace(/`([^`\n]+)`/g, function (_, code) {
      return '<code>' + code + '</code>';
    });

    // 图片（先于链接处理）
    result = result.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function (_, alt, url) {
      return '<img src="' + safeUrl(url) + '" alt="' + alt + '" loading="lazy">';
    });

    // 链接
    result = result.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, textContent, url) {
      return '<a href="' + safeUrl(url) + '" target="_blank" rel="noopener">' + textContent + '</a>';
    });

    // 粗体 / 斜体
    result = result.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    result = result.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    result = result.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    result = result.replace(/(^|[^_])_([^_\n]+)_/g, '$1<em>$2</em>');

    return result;
  }

  function isHr(line) {
    return /^([-*_])([ \t]*\1){2,}[ \t]*$/.test(line);
  }

  function renderMarkdown(md) {
    var codeBlocks = [];
    var text = String(md);

    // 先取出围栏代码块，避免被行内解析破坏
    text = text.replace(/```[ \t]*([\w+-]*)[ \t]*\n([\s\S]*?)```[ \t]*/g, function (_, lang, code) {
      var idx = codeBlocks.length;
      codeBlocks.push({
        lang: lang || '',
        html: '<pre><code' + (lang ? ' class="language-' + escapeHtml(lang) + '"' : '') + '>' + escapeHtml(code.replace(/\n$/, '')) + '</code></pre>'
      });
      return '\u0000CODE' + idx + '\u0000';
    });
    text = text.replace(/~~~[ \t]*([\w+-]*)[ \t]*\n([\s\S]*?)~~~[ \t]*/g, function (_, lang, code) {
      var idx = codeBlocks.length;
      codeBlocks.push({
        lang: lang || '',
        html: '<pre><code' + (lang ? ' class="language-' + escapeHtml(lang) + '"' : '') + '>' + escapeHtml(code.replace(/\n$/, '')) + '</code></pre>'
      });
      return '\u0000CODE' + idx + '\u0000';
    });

    var escaped = escapeHtml(text);
    var lines = escaped.split('\n');
    var html = '';
    var paragraph = [];
    var listType = null;

    function flushParagraph() {
      if (paragraph.length) {
        html += '<p>' + paragraph.map(inline).join('<br>') + '</p>';
        paragraph = [];
      }
    }

    function closeList() {
      if (listType) {
        html += '</' + listType + '>';
        listType = null;
      }
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) {
        flushParagraph();
        closeList();
        continue;
      }

      // 代码块占位符
      var codeMatch = line.match(/^\u0000CODE(\d+)\u0000$/);
      if (codeMatch) {
        flushParagraph();
        closeList();
        html += codeBlocks[Number(codeMatch[1])].html;
        continue;
      }

      // 标题
      var heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        flushParagraph();
        closeList();
        var level = heading[1].length;
        html += '<h' + level + '>' + inline(heading[2]) + '</h' + level + '>';
        continue;
      }

      // 分隔线
      if (isHr(line)) {
        flushParagraph();
        closeList();
        html += '<hr>';
        continue;
      }

      // 引用
      if (line.indexOf('>') === 0) {
        flushParagraph();
        closeList();
        html += '<blockquote><p>' + inline(line.replace(/^>\s?/, '')) + '</p></blockquote>';
        continue;
      }

      // 无序列表
      var ul = line.match(/^[-*+]\s+(.*)$/);
      if (ul) {
        flushParagraph();
        if (listType !== 'ul') {
          closeList();
          html += '<ul>';
          listType = 'ul';
        }
        html += '<li>' + inline(ul[1]) + '</li>';
        continue;
      }

      // 有序列表
      var ol = line.match(/^\d+\.\s+(.*)$/);
      if (ol) {
        flushParagraph();
        if (listType !== 'ol') {
          closeList();
          html += '<ol>';
          listType = 'ol';
        }
        html += '<li>' + inline(ol[1]) + '</li>';
        continue;
      }

      // 普通段落
      closeList();
      paragraph.push(line);
    }

    flushParagraph();
    closeList();

    // 还原代码块
    html = html.replace(/\u0000CODE(\d+)\u0000/g, function (_, idx) {
      return codeBlocks[Number(idx)].html;
    });

    return html;
  }

  function extractTitle(md, index) {
    var lines = String(md || '').split('\n');
    for (var i = 0; i < lines.length; i++) {
      var m = lines[i].match(/^\s{0,3}#\s+(.*)$/);
      if (m) return m[1].trim();
    }
    return '第 ' + index + ' 章';
  }

  // ---------- 章节加载 ----------
  function showStatus(message) {
    reader.innerHTML = '<div class="status">' + escapeHtml(message) + '</div>';
  }

  function showError(message) {
    reader.innerHTML = '<div class="error-box">' + escapeHtml(message) + '</div>';
  }

  function renderChapterList() {
    var html = '<ul class="chapter-list">';
    for (var i = 0; i < chapters.length; i++) {
      var ch = chapters[i];
      var title = extractTitle(ch.text, ch.index);
      html += '<li>';
      html += '<button type="button" class="chapter-item" data-index="' + i + '" id="chapter-btn-' + i + '">';
      html += '<span class="chapter-num">第 ' + ch.index + ' 章</span>';
      html += '<span class="chapter-name">' + escapeHtml(title) + '</span>';
      html += '</button>';
      html += '</li>';
    }
    html += '</ul>';
    chapterListEl.innerHTML = html;

    var buttons = chapterListEl.querySelectorAll('.chapter-item');
    for (var j = 0; j < buttons.length; j++) {
      buttons[j].addEventListener('click', function () {
        var idx = Number(this.getAttribute('data-index'));
        showChapter(idx);
      });
    }
  }

  function showChapter(index) {
    if (!chapters[index]) return;
    currentIndex = index;
    var ch = chapters[index];
    var title = extractTitle(ch.text, ch.index);

    var html = '';
    html += '<h1 class="chapter-title">' + escapeHtml(title) + '</h1>';
    html += '<div class="chapter-file">' + escapeHtml(ch.file) + '</div>';
    html += '<div class="markdown-body">' + renderMarkdown(ch.text) + '</div>';

    reader.innerHTML = html;

    var buttons = chapterListEl.querySelectorAll('.chapter-item');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle('active', i === index);
    }

    // 移动端自动滚回顶部
    window.scrollTo({ top: 0, behavior: 'smooth' });
    document.title = title + ' - 小说在线阅读';
  }

  function isFileProtocol() {
    return window.location.protocol === 'file:';
  }

  async function loadChapters() {
    if (isFileProtocol()) {
      showError('当前是以 file:// 协议直接打开的网页。\n\n浏览器通常不允许网页通过 fetch 读取本地 Markdown 文件。\n\n请先在该 html 文件夹中启动一个静态服务器，例如：\n\n  python3 -m http.server 8080\n\n然后访问：\n  http://localhost:8080');
      return;
    }

    showStatus('正在加载章节…');

    for (var i = 1; i <= MAX_CHAPTERS; i++) {
      var fileName = i + '.md';
      var response;
      try {
        response = await fetch(fileName, { cache: 'no-store' });
      } catch (err) {
        console.error(err);
        showError('读取 ' + fileName + ' 失败。\n\n请确认已通过本地静态服务器访问本页面，而不是直接双击打开 HTML 文件。\n\n也可以尝试：\n  cd html\n  python3 -m http.server 8080\n然后打开 http://localhost:8080');
        return;
      }

      if (response.status === 404) {
        break;
      }

      if (!response.ok) {
        console.error('HTTP ' + response.status + ' for ' + fileName);
        showError('读取 ' + fileName + ' 时服务器返回了 ' + response.status + '。');
        return;
      }

      var text;
      try {
        text = await response.text();
      } catch (err) {
        console.error(err);
        showError('解析 ' + fileName + ' 内容失败。');
        return;
      }

      chapters.push({
        index: i,
        file: fileName,
        text: text
      });
    }

    if (chapters.length === 0) {
      showError('没有找到 Markdown 章节文件。\n\n请将小说章节命名为 1.md、2.md、3.md … 放在本网页同目录下，然后刷新页面。');
      return;
    }

    renderChapterList();
    // 默认显示第一章；以后可扩展为记住上次阅读位置
    showChapter(0);
  }

  loadChapters();
})();
</script>
</body>
</html>
